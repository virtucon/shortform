<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">The universal safe zone inside a 1080 by 1920 frame</title>
  <desc id="desc">TikTok, Shorts and Reels draw their own interface over your video: 250 pixels at the top, 480 at the bottom, 60 on the left and 160 on the right. Everything a viewer must read stays inside the remaining rectangle, x 60 to 920 and y 250 to 1440.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#14213d"/><stop offset="1" stop-color="#243b63"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="0" flood-color="#0c1528" flood-opacity=".45"/></filter>
  </defs>
  <rect width="900" height="520" rx="28" fill="url(#bg)"/>
  <text x="40" y="50" fill="#fffaf0" font-family="Arial, sans-serif" font-size="22" font-weight="700">TEXT NEVER LANDS UNDER THE APP UI</text>

  <g filter="url(#shadow)">
    <rect x="60" y="80" width="225" height="400" rx="14" fill="#0e1830"/>
  </g>
  <g>
    <rect x="60" y="80" width="225" height="52" fill="#ff6b5e" fill-opacity=".38"/>
    <rect x="60" y="380" width="225" height="100" fill="#ff6b5e" fill-opacity=".38"/>
    <rect x="60" y="132" width="13" height="248" fill="#ff6b5e" fill-opacity=".38"/>
    <rect x="252" y="132" width="33" height="248" fill="#ff6b5e" fill-opacity=".38"/>
    <rect x="73" y="132" width="179" height="248" fill="#2ec4a0" fill-opacity=".16" stroke="#2ec4a0" stroke-width="2.5" stroke-dasharray="7 5"/>
  </g>
  <text x="162" y="250" fill="#2ec4a0" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">SAFE</text>
  <text x="162" y="270" fill="#9fd9cb" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">860 × 1190</text>
  <text x="60" y="502" fill="#8fa0bd" font-family="Arial, sans-serif" font-size="13">1080 × 1920 · 30fps</text>

  <g font-family="Arial, sans-serif">
    <rect x="330" y="96" width="24" height="24" rx="6" fill="#ff6b5e" fill-opacity=".38"/>
    <text x="368" y="107" fill="#fffaf0" font-size="16" font-weight="700">top 250px</text>
    <text x="368" y="128" fill="#8fa0bd" font-size="14">status bar, tabs, search</text>

    <rect x="330" y="160" width="24" height="24" rx="6" fill="#ff6b5e" fill-opacity=".38"/>
    <text x="368" y="171" fill="#fffaf0" font-size="16" font-weight="700">bottom 480px</text>
    <text x="368" y="192" fill="#8fa0bd" font-size="14">username, caption, music ticker, progress bar</text>

    <rect x="330" y="224" width="24" height="24" rx="6" fill="#ff6b5e" fill-opacity=".38"/>
    <text x="368" y="235" fill="#fffaf0" font-size="16" font-weight="700">right 160px</text>
    <text x="368" y="256" fill="#8fa0bd" font-size="14">like / comment / share column</text>

    <rect x="330" y="288" width="24" height="24" rx="6" fill="#ff6b5e" fill-opacity=".38"/>
    <text x="368" y="299" fill="#fffaf0" font-size="16" font-weight="700">left 60px</text>
    <text x="368" y="320" fill="#8fa0bd" font-size="14">gutter</text>

    <rect x="330" y="352" width="24" height="24" rx="6" fill="#2ec4a0" fill-opacity=".45" stroke="#2ec4a0" stroke-width="2"/>
    <text x="368" y="363" fill="#fffaf0" font-size="16" font-weight="700">safe rectangle</text>
    <text x="368" y="384" fill="#8fa0bd" font-size="14">x 60–920, y 250–1440 — every readable pixel</text>

    <text x="330" y="440" fill="#8fa0bd" font-size="13">Worst case across TikTok, Shorts and Reels.</text>
    <text x="330" y="460" fill="#8fa0bd" font-size="13">Backgrounds still fill the frame edge to edge.</text>
    <text x="330" y="480" fill="#63708a" font-size="12">Reviewed 2026-09-17 · no platform guarantees these.</text>
  </g>
</svg>
