<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Shortform workflow</title>
  <desc id="desc">Describe video goal, choose a hook and storyboard, then receive a vertical video and post kit.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#14213d"/><stop offset="1" stop-color="#243b63"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="0" flood-color="#0c1528" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <text x="60" y="61" fill="#fffaf0" font-family="Arial, sans-serif" font-size="24" font-weight="700">FROM BRIEF TO POST-READY VIDEO</text>
  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="60" y="105" width="290" height="145" rx="18" fill="#fffaf0"/>
    <text x="86" y="147" fill="#14213d" font-size="17" font-weight="700">1 · DESCRIBE GOAL</text>
    <text x="86" y="181" fill="#14213d" font-size="19">“Get B2B signups”</text>
    <text x="86" y="213" fill="#63708a" font-size="15">Project + plain-language brief</text>
    <rect x="455" y="105" width="290" height="145" rx="18" fill="#ffd166"/>
    <text x="481" y="147" fill="#14213d" font-size="17" font-weight="700">2 · PICK DIRECTION</text>
    <text x="481" y="181" fill="#14213d" font-size="19">3 hooks + storyboard</text>
    <text x="481" y="213" fill="#725c13" font-size="15">One reply before render</text>
    <rect x="850" y="105" width="290" height="145" rx="18" fill="#2ec4a0"/>
    <text x="876" y="147" fill="#14213d" font-size="17" font-weight="700">3 · POST</text>
    <text x="876" y="181" fill="#14213d" font-size="19">MP4 + cover + caption</text>
    <text x="876" y="213" fill="#0d6451" font-size="15">TikTok · Shorts · Reels</text>
  </g>
  <path d="M375 178h45m-12-12 12 12-12 12M770 178h45m-12-12 12 12-12 12" fill="none" stroke="#fffaf0" stroke-linecap="round" stroke-linejoin="round" stroke-width="5"/>
</svg>
