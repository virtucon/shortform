<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">The five stages of a Shortform run</title>
  <desc id="desc">Preflight checks the tools, Understand reads your project files, Plan writes three hooks and a storyboard, Compose builds a 1080 by 1920 HyperFrames composition, and Deliver renders the video and writes the post kit.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#14213d"/><stop offset="1" stop-color="#243b63"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="0" flood-color="#0c1528" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1200" height="260" rx="28" fill="url(#bg)"/>
  <text x="40" y="54" fill="#fffaf0" font-family="Arial, sans-serif" font-size="22" font-weight="700">HOW A RUN GOES</text>
  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="40" y="86" width="200" height="130" rx="16" fill="#fffaf0"/>
    <text x="60" y="120" fill="#63708a" font-size="13" font-weight="700">1</text>
    <text x="60" y="150" fill="#14213d" font-size="18" font-weight="700">Preflight</text>
    <text x="60" y="176" fill="#63708a" font-size="13">hyperframes doctor</text>
    <text x="60" y="196" fill="#63708a" font-size="13">stops if anything</text>

    <rect x="270" y="86" width="200" height="130" rx="16" fill="#fffaf0"/>
    <text x="290" y="120" fill="#63708a" font-size="13" font-weight="700">2</text>
    <text x="290" y="150" fill="#14213d" font-size="18" font-weight="700">Understand</text>
    <text x="290" y="176" fill="#63708a" font-size="13">reads your README,</text>
    <text x="290" y="196" fill="#63708a" font-size="13">styles, copy, colours</text>

    <rect x="500" y="86" width="200" height="130" rx="16" fill="#ffd166"/>
    <text x="520" y="120" fill="#725c13" font-size="13" font-weight="700">3</text>
    <text x="520" y="150" fill="#14213d" font-size="18" font-weight="700">Plan</text>
    <text x="520" y="176" fill="#725c13" font-size="13">3 hooks + storyboard</text>
    <text x="520" y="196" fill="#725c13" font-size="13">you pick one</text>

    <rect x="730" y="86" width="200" height="130" rx="16" fill="#fffaf0"/>
    <text x="750" y="120" fill="#63708a" font-size="13" font-weight="700">4</text>
    <text x="750" y="150" fill="#14213d" font-size="18" font-weight="700">Compose</text>
    <text x="750" y="176" fill="#63708a" font-size="13">1080×1920 in HTML</text>
    <text x="750" y="196" fill="#63708a" font-size="13">and CSS, then check</text>

    <rect x="960" y="86" width="200" height="130" rx="16" fill="#2ec4a0"/>
    <text x="980" y="120" fill="#0d6451" font-size="13" font-weight="700">5</text>
    <text x="980" y="150" fill="#14213d" font-size="18" font-weight="700">Deliver</text>
    <text x="980" y="176" fill="#0d6451" font-size="13">render, cover frame,</text>
    <text x="980" y="196" fill="#0d6451" font-size="13">post kit</text>
  </g>
  <path d="M248 151h12m-6-7 7 7-7 7M478 151h12m-6-7 7 7-7 7M708 151h12m-6-7 7 7-7 7M938 151h12m-6-7 7 7-7 7" fill="none" stroke="#fffaf0" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/>
</svg>
