name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # no Python project here, so there is nothing for the cache to key on
          enable-cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Validate SKILL.md against the Agent Skills spec
        # pinned: skills-ref has no releases
        run: uvx --from "git+https://github.com/agentskills/agentskills@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref" skills-ref validate ./skills/shortform

      - name: Plugin manifests are valid JSON with matching names
        run: |
          test "$(jq -r .name .claude-plugin/plugin.json)" = "shortform"
          test "$(jq -r '.plugins[0].name' .claude-plugin/marketplace.json)" = "shortform"

      - name: Harness symlinks resolve
        run: |
          test -f .claude/skills/shortform/SKILL.md
          test -f .agents/skills/shortform/SKILL.md

      - name: Relative links in the skill resolve
        run: |
          cd skills/shortform
          fail=0
          for f in SKILL.md references/*.md; do
            dir=$(dirname "$f")
            for link in $(grep -o '](\([^)#]*\))' "$f" | sed 's/^](//; s/)$//' | grep -v '^https\?:' || true); do
              [ -e "$dir/$link" ] || { echo "$f: broken link $link"; fail=1; }
            done
          done
          exit $fail

      - name: skills CLI discovers the skill
        # no `grep -q`: it closes the pipe on first match and the CLI dies with EPIPE
        run: npx -y skills@1.7.0 add . --list | grep shortform

      - name: init always carries the skip-skills guard
        # without it, init writes nine skills into the user's ~/.claude/skills and ~/.agents/skills
        run: |
          if grep -rn 'hyperframes@[0-9.]* init' skills/ | grep -v 'HYPERFRAMES_SKIP_SKILLS=1'; then
            echo "init call above is missing HYPERFRAMES_SKIP_SKILLS=1"
            exit 1
          fi

      - name: The 30s cap is stated where it is enforced
        # the old 60s cap survived because only this ffprobe line actually enforced it
        run: |
          grep -q 'at most 30s' skills/shortform/references/deliver.md \
            || { echo "deliver.md no longer gates the render at 30s"; exit 1; }
          grep -q 'Hard cap 30s' skills/shortform/SKILL.md \
            || { echo "SKILL.md no longer records the 30s cap on the brief"; exit 1; }

      - name: The hyperframes CLI is pinned everywhere the skill calls it
        run: |
          if grep -rn 'npx hyperframes\( \|`\)' skills/ | grep -v 'hyperframes@'; then
            echo "unpinned 'npx hyperframes' above — use npx hyperframes@<version>"
            exit 1
          fi
